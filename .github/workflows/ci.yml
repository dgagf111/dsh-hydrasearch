name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel a superseded run on the same ref instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: verify (${{ matrix.generation.label }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
        # Every DSH generation this plugin claims to support, each pinned
        # exactly. Two of them share a generation but differ in schemastery,
        # because that is the axis the plugin's compatibility shim actually
        # rides — and the axis that silently changed under an unchanged commit
        # when `^3.18.2` started resolving to 3.18.4.
        generation:
          - id: rc6-3182
            label: 'rc.6 + schemastery 3.18.2'
            dsh: '0.1.0-rc.6'
            cordis: '4.0.1'
            schemastery: '3.18.2'
            settingsFile: true
          - id: rc6-3184
            label: 'rc.6 + schemastery 3.18.4'
            dsh: '0.1.0-rc.6'
            cordis: '4.0.1'
            schemastery: '3.18.4'
            settingsFile: true
          - id: alpha016
            label: '0.1.6-alpha.2 + schemastery 3.18.2'
            dsh: '0.1.6-alpha.2'
            cordis: '4.0.2'
            schemastery: '3.18.2'
            settingsFile: true
          - id: rc1
            label: '0.1.7-rc.1 + schemastery 3.18.4'
            dsh: '0.1.7-rc.1'
            cordis: '4.0.4'
            schemastery: '3.18.4'
            settingsFile: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install DSH service modules
        # EXACT pins only. A floating range let a dependency release change what
        # CI tested without any code change: `schemastery@^3.18.2` resolved to
        # 3.18.2 when the commit was authored and to 3.18.4 two days later, which
        # turned a README-only push red. The matrix above is the replacement.
        #
        # Why these pairings:
        #   - 3.18.2 is what the 0.1.6-alpha.2 desktop build ships and has NO
        #     `.volatile()`; 3.18.4 is marker-capable.
        #   - rc.6 is tested against BOTH, because a marker-capable schemastery
        #     plus a registration-generation settings service is the combination
        #     that stored a cordis ref as the resolved config.
        #   - `dsh-settings-file` does not exist for 0.1.7-rc.1, so that
        #     generation installs without it and skips the suites that need it.
        #
        # `--legacy-peer-deps` remains required: the DSH peer graph is
        # self-referential across generations, so npm's strict resolver reports
        # ERESOLVE even though every package involved is published/installable.
        run: |
          PKGS=(
            "@deepseek-ai/cordis@${{ matrix.generation.cordis }}"
            "@deepseek-ai/dsh-app-boot@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-atomic-write@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-credentials@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-credentials-local@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-home-paths@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-launch-environment@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-llm@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-scope@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-settings@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-system-prompt@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-timeout@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-tools@${{ matrix.generation.dsh }}"
            "@deepseek-ai/dsh-web@${{ matrix.generation.dsh }}"
            "@deepseek-ai/schemastery@${{ matrix.generation.schemastery }}"
            "react@18.3.1"
            "react-dom@18.3.1"
          )
          if [ "${{ matrix.generation.settingsFile }}" = "true" ]; then
            PKGS+=("@deepseek-ai/dsh-settings-file@${{ matrix.generation.dsh }}")
          fi
          npm install --no-audit --no-fund --legacy-peer-deps "${PKGS[@]}"

          # Record what actually landed: a silent resolution change is the
          # failure mode this job exists to make visible.
          node -e '
            const read = (name) => require(`${name}/package.json`).version
            console.log("schemastery", read("@deepseek-ai/schemastery"))
            console.log("dsh-settings", read("@deepseek-ai/dsh-settings"))
            console.log("dsh-web", read("@deepseek-ai/dsh-web"))
            console.log("cordis", read("@deepseek-ai/cordis"))
          '

      - name: Server-side unit checks
        # The live-network section self-skips when no API key is present, so this
        # runs the full offline contract suite in CI. Add a TINYFISH_API_KEY
        # repository secret to also exercise the real service.
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
        run: node scripts/verify.mjs

      - name: Browser-half checks
        run: node scripts/verify-client.mjs

      - name: CI workflow checks
        # The workflow is the only place the supported-generation matrix is
        # declared, and a mistake there is invisible until GitHub runs it. This
        # validates the file itself: exact pins only, the four-generation matrix,
        # and the conditional steps for the generation with no dsh-settings-file.
        run: node scripts/verify-workflow.mjs

      - name: In-process integration checks
        # Mounts the real WebRuntime / settings / credentials services on a real
        # Cordis context and calls the plugin's apply(). This is the suite that
        # proves the plugin works against the actual seam rather than a stub.
        #
        # Skipped for 0.1.7-rc.1: that generation has no `dsh-settings-file`
        # package at all (the file provider was folded into `SettingsForms`), so
        # the suite's mount cannot be composed. Its registration-less branch is
        # covered by the `release-compatibility contract` checks in verify.mjs.
        if: matrix.generation.settingsFile
        run: node scripts/verify-integration.mjs

      - name: End-to-end regression proof
        # Reproduces the two reported failures on a scratch home — including the
        # exported `TINYFISH_API_KEY` that made a saved key unreachable and
        # unclearable — and asserts both are fixed.
        if: matrix.generation.settingsFile
        run: node scripts/verify-e2e.mjs

      - name: Shipped modules parse, and the manifest is self-consistent
        # `verify-profile.mjs` composes a live PROFILE, which CI has no access to,
        # so it cannot run here. What CI can still prove is that every shipped
        # module PARSES and that the manifest's own claims hold — `name: ./lib/index.js`
        # in cordis.patch.yml is resolved relative to the patch file, so a typo
        # there is a load failure that no unit test would see.
        run: |
          node --check lib/index.js
          node --check lib/tinyfish.js
          node --check lib/anysearch.js
          node --check lib/client.js
          node --check scripts/deploy.mjs
          node --check scripts/verify-e2e.mjs
          echo "all shipped modules parse"

          node -e '
            const { readFileSync, existsSync } = require("node:fs")
            const assert = require("node:assert/strict")
            const path = require("node:path")

            const pkg = JSON.parse(readFileSync("package.json", "utf8"))
            assert.equal(pkg.name, "dsh-hydrasearch")
            assert.ok(pkg.dsh.bundle.patch, "the bundle patch must be declared")
            assert.ok(pkg.dsh.client, "the client face must be declared")
            assert.ok(pkg.files.includes(pkg.dsh.bundle.patch), "the patch must be published")

            // Every literal file listed for publication must exist.
            for (const f of pkg.files) {
              if (f.includes("*")) continue
              assert.ok(existsSync(f), "published file missing: " + f)
            }

            // The bundle patch row name is resolved against the patch file dir.
            const patch = readFileSync(pkg.dsh.bundle.patch, "utf8")
            const rowNames = [...patch.matchAll(/^\s*name:\s*(\S+)\s*$/gm)].map((m) => m[1])
            assert.ok(rowNames.length > 0, "the bundle patch declares no row name")
            for (const name of rowNames) {
              const resolved = path.resolve(path.dirname(pkg.dsh.bundle.patch), name)
              assert.ok(existsSync(resolved), "row name does not resolve: " + name + " -> " + resolved)
            }
            console.log("manifest checks passed; row names resolve:", rowNames.join(", "))
          '

  package:
    name: npm pack sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The published tarball contains what it claims
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for expected in lib/index.js lib/client.js lib/tinyfish.js lib/anysearch.js cordis.patch.yml README.md LICENSE; do
            grep -q "$expected" /tmp/pack.txt || { echo "MISSING FROM TARBALL: $expected"; exit 1; }
          done
          # A half-written staging directory must never ship.
          if grep -q '\.staging/' /tmp/pack.txt; then echo "staging dir leaked into the tarball"; exit 1; fi
          echo "tarball contents verified"
